<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <title>RPG Pânico — Mesa</title>
    <link href="https://fonts.googleapis.com/css2?family=Creepster&family=Special+Elite&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0910;
            --c1: #151119;
            --c2: #201a28;
            --ln: rgba(236, 230, 218, .16);
            --ink: #ece6da;
            --dim: #a89ea3;
            --red: #d81f2c;
            --rd: #a4141f;
            --org: #e07a1f;
            --moon: #8f7ec4;
            --ok: #4f9b6a;
            --ty: 'Special Elite', monospace;
            --di: 'Creepster', cursive;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        * {
            box-sizing: inherit
        }

        html,
        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 15px/1.5 system-ui, sans-serif
        }

        body {
            background: radial-gradient(ellipse 800px 500px at 90% 0, rgba(164, 20, 31, .18), transparent 60%), var(--bg);
            min-height: 100vh
        }

        .w {
            max-width: 900px;
            margin: 0 auto;
            padding: 16px 14px 60px
        }

        h1 {
            font: 400 clamp(2rem, 8vw, 3.2rem)/1 var(--di);
            margin: 4px 0;
            text-shadow: 0 0 20px rgba(164, 20, 31, .6)
        }

        h2,
        h3 {
            font-family: var(--ty);
            font-weight: 400;
            margin: 0 0 8px;
            color: var(--org);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: .05em
        }

        .top {
            text-align: center;
            padding: 10px 0 14px
        }

        .top small {
            font-family: var(--ty);
            color: var(--moon)
        }

        .card {
            background: var(--c1);
            border: 1px solid var(--ln);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 12px
        }

        button,
        select,
        input,
        textarea {
            font: inherit;
            color: var(--ink);
            background: var(--c2);
            border: 1px solid var(--ln);
            border-radius: 7px;
            padding: 7px 10px
        }

        textarea {
            width: 100%;
            min-height: 60px
        }

        input[type=text],
        input[type=password],
        select {
            width: 100%
        }

        button {
            cursor: pointer;
            font-family: var(--ty);
            font-size: 13px
        }

        button:hover {
            border-color: var(--org)
        }

        button:disabled {
            opacity: .35;
            cursor: not-allowed
        }

        .b {
            background: var(--rd);
            border-color: var(--red)
        }

        .sm {
            padding: 3px 9px
        }

        .row {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap
        }

        .sp {
            flex: 1
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 10px
        }

        .cnt {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 6px 0
        }

        .cnt b {
            font: 400 22px var(--ty);
            min-width: 46px;
            text-align: center
        }

        .cnt span {
            min-width: 130px;
            font-family: var(--ty);
            font-size: 13px;
            color: var(--dim)
        }

        .die {
            display: inline-flex;
            width: 38px;
            height: 38px;
            border: 2px solid var(--ln);
            border-radius: 8px;
            align-items: center;
            justify-content: center;
            font: 18px var(--ty);
            margin: 2px
        }

        .die.s {
            border-color: var(--ok);
            color: var(--ok)
        }

        .die.f {
            border-color: var(--rd);
            color: var(--red)
        }

        .tag {
            display: inline-block;
            font: 12px var(--ty);
            border: 1px solid var(--ln);
            border-radius: 20px;
            padding: 2px 9px;
            margin: 2px;
            color: var(--dim)
        }

        .vivo {
            color: var(--ok)
        }

        .ferido {
            color: var(--org)
        }

        .morto {
            color: var(--red)
        }

        .mk {
            display: flex;
            gap: 6px;
            align-items: center;
            margin: 4px 0
        }

        .mk span {
            flex: 1
        }

        .mc {
            cursor: pointer
        }

        .mc:hover {
            border-color: var(--org)
        }

        .dim {
            color: var(--dim);
            font-size: 13px
        }

        .warn {
            color: var(--red);
            font-family: var(--ty)
        }

        details {
            margin-bottom: 8px
        }

        summary {
            cursor: pointer;
            font-family: var(--ty);
            color: var(--ink)
        }

        .hud {
            position: sticky;
            top: 0;
            z-index: 5;
            background: rgba(10, 9, 16, .94);
            backdrop-filter: blur(6px);
            border: 1px solid var(--ln);
            border-radius: 12px;
            padding: 10px;
            margin: 8px 0 10px
        }

        .av {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--rd);
            display: flex;
            align-items: center;
            justify-content: center;
            font: 20px var(--di);
            flex: none
        }

        .nm {
            font: 400 20px var(--di)
        }

        .st4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-top: 8px
        }

        .st4>div {
            background: var(--c2);
            border: 1px solid var(--ln);
            border-radius: 8px;
            text-align: center;
            padding: 4px
        }

        .st4 small {
            display: block;
            font: 10px var(--ty);
            color: var(--dim)
        }

        .st4 b {
            font: 400 20px var(--ty)
        }

        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
            margin-bottom: 10px
        }

        .tabs button,
        #nav button {
            white-space: nowrap;
            flex: 1
        }

        .act {
            background: var(--rd) !important;
            border-color: var(--red) !important
        }

        #nav {
            display: flex;
            gap: 6px;
            margin-bottom: 8px
        }

        .pips {
            display: flex;
            gap: 6px;
            flex-wrap: wrap
        }

        .pip {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 2px solid var(--ln);
            background: var(--c2);
            padding: 0
        }

        .pip.ro {
            cursor: default;
            display: inline-block
        }

        .pip.on.dice {
            background: var(--moon);
            border-color: var(--moon)
        }

        .pip.on.fuga {
            background: var(--ok);
            border-color: var(--ok)
        }

        .pip.on.ten {
            background: var(--org);
            border-color: var(--org)
        }

        .pip.on.wound {
            background: var(--red);
            border-color: var(--red)
        }

        .trk {
            margin: 0 0 14px
        }

        .trh {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-family: var(--ty);
            font-size: 13px
        }

        .stp {
            display: flex;
            align-items: center;
            gap: 8px
        }

        .stp b,
        .mval {
            font: 400 20px var(--ty);
            min-width: 30px;
            text-align: center
        }

        .hb {
            padding: 0 7px;
            border-radius: 50%;
            font-size: 12px;
            margin-left: 6px;
            border-color: var(--org);
            color: var(--org)
        }

        .helpbox {
            background: var(--c2);
            border-left: 3px solid var(--org);
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 10px;
            font-size: 13px;
            color: var(--dim)
        }

        .av {
            overflow: hidden;
            cursor: pointer
        }

        .av img {
            width: 100%;
            height: 100%;
            object-fit: cover
        }

        .av.big {
            width: 80px;
            height: 80px
        }

        .av.sm2 {
            width: 30px;
            height: 30px;
            font-size: 14px
        }

        .ab {
            border: 1px solid var(--ln);
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px
        }

        .ab.used {
            opacity: .55
        }

        .card h2 {
            border-bottom: 1px solid var(--ln);
            padding-bottom: 6px;
            margin-bottom: 10px
        }

        .vulto {
            border-color: var(--rd)
        }

        .alert {
            margin-top: 10px;
            padding: 10px;
            border: 1px solid var(--red);
            border-radius: 8px;
            background: rgba(164, 20, 31, .15)
        }

        .dice {
            margin: 8px 0
        }

        .die {
            width: 46px;
            height: 46px;
            font-size: 22px
        }

        .die.s {
            box-shadow: 0 0 12px rgba(79, 155, 106, .45)
        }

        .fq {
            border-bottom: 1px solid var(--ln);
            padding: 8px 0
        }

        .fq summary {
            font-size: 15px
        }

        .mk {
            border-bottom: 1px dashed var(--ln);
            padding: 5px 0
        }

        .act.vivo {
            background: var(--ok) !important
        }

        .act.ferido {
            background: var(--org) !important
        }

        @media(min-width:760px) {
            .w {
                padding-top: 24px
            }
        }
    </style>
</head>

            else if (T === 'va') body = `<div class="card"><h2>Vantagens <span class="tag">${s.ten} PT disponíveis</span> ${hp('van')}</h2>${hbox('van')}${VANT.filter(v => !v[2] || c.sp.includes(v[2])).map(v => `<div class="mk"><span><b>${v[0]}</b> <span class="tag">${v[1] === 'var' ? 'livre' : (v[0] === 'Choque de Realidade' && c.k ? 5 : v[1]) + ' PT'}</span><br><span class="dim">${v[3]}</span></span>${v[1] === 'var' ? '<input type="number" class="vc" min="1" value="1" style="width:60px">' : ''}<button class="sm" data-a="buy" data-i="${VANT.indexOf(v)}" ${v[1] !== 'var' && s.ten < (v[0] === 'Choque de Realidade' && c.k ? 5 : v[1]) ? 'disabled' : ''}>Comprar</button></div>`).join('')}
<div class="row" style="margin-top:10px"><input type="text" id="cn" placeholder="Outro item/benefício comprado" style="flex:2"><input type="number" id="cc" placeholder="PT" min="0" style="width:70px"><button data-a="cbuy">Comprar</button></div></div>
<div class="card"><h2>Comprados ${hp('com')}</h2>${hbox('com')}${s.buy.map((b, i) => `<div class="mk"><span>✔ ${E(b.n)} <span class="dim">(${b.c} PT)</span></span><button class="sm" data-a="bu" data-i="${i}">usado ✕</button></div>`).join('') || '<p class="dim">Nada ainda.</p>'}</div>`;
            else if (T === 'cl') body = `<div class="card"><h2>Clamores escolhidos ${hp('cla')}</h2>${hbox('cla')}${s.qs.map((q, i) => `<div class="mk"><span><b>${E(q.n)}</b> <span class="tag">${E(q.t)}</span><br><span class="dim">${E(q.e)}</span></span><button class="sm" data-a="qr" data-i="${i}">✕</button></div>`).join('') || '<p class="dim">Nenhum clamor ainda. Escolha após o Rito de Iniciação.</p>'}
<div class="row" style="margin-top:10px"><select id="qsel" style="flex:1"><optgroup label="Favoráveis">${QUAL.fav.map(q => `<option value="fav|${E(q[0])}">${E(q[0])}</option>`).join('')}</optgroup><optgroup label="Neutras">${QUAL.neu.map(q => `<option value="neu|${E(q[0])}">${E(q[0])}</option>`).join('')}</optgroup></select><button data-a="qa">+ Adicionar</button></div><div class="row" style="margin-top:8px"><input type="text" id="qn" placeholder="Clamor personalizado" style="flex:1"><input type="text" id="qe" placeholder="Efeito" style="flex:2"><button data-a="qc">+</button></div></div>
<div class="card"><h2>Lista de qualidades</h2>${[['Favoráveis', 'fav'], ['Neutras', 'neu']].map(g => `<details><summary>${g[0]}</summary>${QUAL[g[1]].map(q => `<p><b>${E(q[0])}</b><br><span class="dim">${E(q[1])}</span></p>`).join('')}</details>`).join('')}</div>`;
            else if (T === 'it') body = `<div class="card"><h2>Inventário ${hp('inv')}</h2>${hbox('inv')}${s.inv.map((x, i) => `<div class="mk"><span>• ${E(x)}</span><button class="sm" data-a="ir" data-i="${i}">✕</button></div>`).join('') || '<p class="dim">Vazio.</p>'}<div class="row"><input type="text" id="ni" placeholder="Novo item" style="flex:1"><button data-a="ia">Adicionar</button></div></div><div class="card"><h2>Anotações ${hp('nt')}</h2>${hbox('nt')}<textarea id="nt" placeholder="Pistas, suspeitas, lembretes…">${E(s.nt)}</textarea></div>`;
            else body = `<div class="card"><h2>Foto e especialidades ${hp('foto')}</h2>${hbox('foto')}<div class="row"><div class="av big" data-pick="1">${s.pic ? `<img src="${s.pic}">` : E(ini)}</div><button data-pick="1">📷 Trocar foto</button>${s.pic ? '<button data-a="pr">Remover</button>' : ''}</div><p>${c.sp.map(x => `<span class="tag">${x}</span>`).join('')}</p></div>
<div class="card"><h2>Quem é você</h2><p><b>História:</b> ${E(c.bs)}</p><p><b>Maior medo:</b> ${E(c.fear)}</p>${c.q ? `<p><i>“${E(c.q)}”</i></p>` : ''}</div>
<div class="card"><h2>Segredos</h2><p><b>Segredo:</b> ${E(c.sec)}</p><p><b>Motivo para matar:</b> ${E(c.mt)}</p><p><b>Apegos:</b><br>🔸 Item icônico (+1 PT): ${E(c.ap[0])}<br>🔸 Relação afetiva (+2 PT): ${E(c.ap[1])}<br>🔸 Desejo obscuro (+3 PT): ${E(c.ap[2])}</p></div>`;
            $('#app').innerHTML = `<div class="row"><button id="back">${view.m ? '← Mestre' : 'Sair'}</button><span class="sp"></span><span class="dim">💾 salvo neste aparelho</span></div>
<div class="hud"><div class="row"><div class="av" data-pick="1">${s.pic ? `<img src="${s.pic}">` : E(ini)}</div><input type="file" id="pf" accept="image/*" hidden><div class="sp"><b class="nm">${E(c.n)}</b><div class="dim">${E(c.c)} · ${E(c.a)} anos · ${E(c.pr)} · ${E(c.p)}</div></div><span class="${s.st}">● ${s.st}</span></div>
<div class="st4"><div><small>DADOS</small><b>${s.dice}</b></div><div><small>FERIDAS</small><b class="${f >= 6 ? 'warn' : ''}">${f}</b></div><div><small>FUGA</small><b>${s.fuga}</b></div><div><small>TENSÃO</small><b>${s.ten}</b></div></div></div>
<div class="tabs">${tabs.map(t => `<button class="${t[0] === T ? 'act' : ''}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>${body}`;
            bind(id, c, s)
        }
        function rollHTML() { if (!lastRoll) return '<p class="dim">Nenhuma rolagem ainda.</p>'; const r = lastRoll; return `<div class="dice">${r.d.map(v => `<span class="die ${v >= r.t ? 's' : 'f'}">${v}</span>`).join('')}</div><p><b>${r.s}</b> sucesso(s) · ${r.f} falha(s) — precisa de ${r.n}: <b class="${r.s >= r.n ? 'vivo' : 'warn'}">${r.s >= r.n ? 'SUPEROU' : 'FRACASSOU'}</b></p>${r.f && !r.ap ? `<button data-a="loss">Descontar ${r.f} falha(s) dos dados comuns</button>` : ''}` }
        function hbind() { document.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { view.h = view.h || {}; view.h[b.dataset.h] = !view.h[b.dataset.h]; render() }) }
        function bind(id, c, s) {
            const sv = () => { save(id); render() };
            $('#back').onclick = () => open({ t: view.m ? 'm' : 'login' });
            document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { view.tab = b.dataset.t; render() }); hbind(); const pf = $('#pf'); document.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pf.click()); pf.onchange = () => { const f = pf.files[0]; if (!f) return; const im = new Image(); im.onload = () => { const z = 192, cv = document.createElement('canvas'); cv.width = cv.height = z; const m = Math.min(im.width, im.height), x = cv.getContext('2d'); x.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, 0, 0, z, z); s.pic = cv.toDataURL('image/jpeg', .8); URL.revokeObjectURL(im.src); sv() }; im.src = URL.createObjectURL(f) };
            const mk = $('#mask'); if (mk) mk.onclick = () => { view.cf = true; render() }; const no = $('#mkno'); if (no) no.onclick = () => { view.cf = false; render() }; const ok = $('#mkok'); if (ok) ok.onclick = () => { view.cf = false; s.km = true; s.k.ph += s.ten; s.ten = 0; s.give = s.dice; s.dice = 0; sv() }; const ar = $('#arq'); if (ar) ar.onclick = () => { if (s.k.dice >= 2) { s.k.dice -= 2; s.cl = (s.cl || 0) + 1; sv() } };
            document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { const k = b.dataset.p, n = +b.dataset.i; s[k] = s[k] === n ? n - 1 : n; sv() });
            const roll = (n, t, need) => { const d = Array.from({ length: n }, () => 1 + Math.floor(Math.random() * 6)), sc = d.filter(v => v >= t).length; lastRoll = { d, t, n: need, s: sc, f: n - sc, ap: false }; render() };
            document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => {
                const a = b.dataset.a, i = +b.dataset.i, k = b.dataset.k;
                if (a === 'inc') s[k] = Math.min(+b.dataset.max, s[k] + 1); else if (a === 'dec') s[k] = Math.max(0, s[k] - 1); else if (a === 'st') s.st = b.dataset.v;
                else if (a === 'ma') s.mk.push({ t: $('#mt').value, v: 1 }); else if (a === 'mv') s.mk[i].v = Math.max(1, Math.min(6, s.mk[i].v + +b.dataset.d)); else if (a === 'mr') s.mk.splice(i, 1);
                else if (a === 'rn') { view.rn = Math.max(1, Math.min(12, (view.rn || Math.max(1, Math.min(s.dice, 6))) + +b.dataset.d)); return render() }
                else if (a === 'roll') { view.rr = $('#rr').value; view.rs = $('#rs').checked; return roll(view.rn || Math.max(1, Math.min(s.dice, 6)), view.rs ? 3 : 4, +view.rr) }
                else if (a === 'susto') return roll(1, view.rs ? 3 : 4, 1);
                else if (a === 'abu') s.ab[i].u = !s.ab[i].u; else if (a === 'abr') s.ab.splice(i, 1); else if (a === 'abreset') s.ab.forEach(x => x.u = false); else if (a === 'aba') { const n = $('#an').value.trim(); if (n) s.ab.push({ n, d: $('#ad').value.trim(), u: false }) }
                else if (a === 'pr') s.pic = ''; else if (a === 'qr') s.qs.splice(i, 1); else if (a === 'qa') { const [t, n] = $('#qsel').value.split('|'), q = QUAL[t].find(x => x[0] === n); s.qs.push({ n, t: t === 'fav' ? 'Favorável' : 'Neutra', e: q[1] }) } else if (a === 'qc') { const n = $('#qn').value.trim(); if (n) s.qs.push({ n, t: 'Personalizado', e: $('#qe').value.trim() }) }
                else if (a === 'loss') { s.dice = Math.max(0, s.dice - lastRoll.f); lastRoll.ap = true }
                else if (a === 'buy') {
                    const v = VANT[i]; let cost = v[1]; if (cost === 'var') { cost = Math.min(s.ten, +b.parentNode.querySelector('.vc').value || 0); if (cost <= 0) return } if (v[0] === 'Choque de Realidade' && c.k) cost = 5; if (s.ten < cost) return; s.ten -= cost; if (v[0] === 'Choque de Realidade') s.dice = Math.min(6, s.dice + 1);
                    if (v[0] === 'Cuidar de Feridas') { let r = cost; s.mk.filter(m => m.t === 'Ferida').forEach(m => { const x = Math.min(m.v, r); m.v -= x; r -= x }); s.mk = s.mk.filter(m => m.t !== 'Ferida' || m.v > 0) } else s.buy.push({ n: v[0], c: cost })
                }
                else if (a === 'cbuy') { const n = $('#cn').value.trim(), cc = +$('#cc').value || 0; if (!n || cc > s.ten) return; s.ten -= cc; s.buy.push({ n, c: cc }) }
                else if (a === 'bu') s.buy.splice(i, 1); else if (a === 'ir') s.inv.splice(i, 1); else if (a === 'ia') { const v = $('#ni').value.trim(); if (v) s.inv.push(v) }
                sv()
            });
            const nt = $('#nt'); if (nt) nt.oninput = () => { s.nt = nt.value; save(id) }
        }
        function faq() {
            const Q = [['Como eu entro na minha ficha?', 'Na aba Mesa, escolha seu personagem e digite a senha combinada com o mestre. O mestre entra escolhendo "Mestre".'], ['Minhas alterações ficam salvas?', 'Sim. Tudo é salvo automaticamente neste aparelho (localStorage) e, quando a mesa está conectada, também fica visível para o mestre. Se trocar de aparelho ou limpar os dados do navegador, use a versão sincronizada.'], ['Como funciona um teste?', 'Você anuncia quantos dados da pilha vai arriscar e rola todos. Sucesso é 4, 5 ou 6 (3 ou mais se o teste usa sua especialidade). Risco Comum precisa de 1 sucesso; Complexo, de 2.'], ['O que acontece com os dados que falham?', 'Em Cenas Livres e de Suspense, são sacrificados e vão para a pilha da Diretora. Em Encontros e Testes de Susto, são descartados. Use "Descontar falhas" para tirá-los da sua pilha.'], ['Quantos dados eu tenho?', 'Todos começam com 6 dados e nunca passam disso.'], ['O que são dados marcadores?', 'Representam condições que evoluem: Feridas (somam; ao chegar em 6 a personagem morre), Sequelas, Infecção, Possessão e Restrição. Não entram em testes.'], ['Como ganho e gasto Pontos de Tensão?', 'Ganha com riscos clichês de filme de terror, boas interpretações e usando seus Apegos (item +1, relação +2, desejo obscuro +3). Gasta na aba Vantagens (máximo 10).'], ['O que são as Etapas de Fuga?', 'Para escapar de um Encontro você precisa acumular Dados de Fuga igual às Etapas de Fuga definidas pela Diretora. Vazar Dali converte sucessos de Agilidade em Dados de Fuga.'], ['Para que serve o Teste de Susto?', 'Quando algo assusta o grupo você rola 1 dado como Risco Comum. Se falhar, o dado é descartado.'], ['O que é "Tirar a Máscara"?', 'Só aparece para quem é Vulto (Charlotte e Vivian). Revela a pessoa como Assassino: seus PT viram PH e seus dados vão para os outros jogadores. Não dá para fazer isso por engano: há uma confirmação.'], ['Esqueci minha senha.', 'Peça ao mestre. A senha do mestre é só dele.'], ['O mestre vê minha ficha?', 'Sim: o mestre vê um resumo de todos (dados, feridas, fuga, tensão, itens comprados) e pode abrir cada ficha.']];
            $('#app').innerHTML = `<div class="card"><h2>Perguntas frequentes</h2>${Q.map(q => `<details class="fq"><summary>${q[0]}</summary><p class="dim">${q[1]}</p></details>`).join('')}</div>`
        }
        function killer(c, s) {
            const k = s.k, K = c.k; k.th = k.th || K.th; k.th2 = k.th2 || ''; k.n1 = k.n1 ?? K.nb; k.n2 = k.n2 ?? 0; k.ua = k.ua || []; const mx = Math.max(k.n1, k.n2), T = TH[k.th], T2 = k.th2 && TH[k.th2];
            const nbo = (v, z) => `<select data-nb="${z}" style="width:70px">${[0, 1, 2, 3, 4, 5, 6].map(n => `<option ${n === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`, tho = (v, z, em) => `<select data-th="${z}">${em ? '<option value="">— nenhuma —</option>' : ''}${Object.keys(TH).map(n => `<option ${n === v ? 'selected' : ''}>${n}</option>`).join('')}</select>`;
            $('#app').innerHTML = `<div class="row"><button id="back">${view.m ? '← Mestre' : 'Sair'}</button><span class="sp"></span><button id="unm">↩ Voltar a sobrevivente</button></div>
<div class="card" style="border-color:var(--red)"><h1 style="font-size:2rem">🔪 ${E(c.n)} — Assassino</h1>${s.give ? `<p class="warn">Entregue ${s.give} dados aos outros Intérpretes. <button class="sm" id="gv">Já entreguei</button></p>` : ''}
<div class="row">Ameaça principal ${tho(k.th, 1)} NB ${nbo(k.n1, 1)}</div><div class="row" style="margin-top:6px">Segunda ameaça ${tho(k.th2, 2, 1)} NB ${nbo(k.n2, 2)}</div>
<p class="dim">Pelo livro: pilha inicial ${k.n1 + k.n2} dados · Testes de Susto ${Math.max(0, 7 - mx)} por Encontro · Armadilhas grátis ${Math.max(0, 7 - mx)} · Etapa de Fuga base ${mx + 1} · PH inicial ${k.n1} · Passos de Suspense ${Math.max(0, 4 - mx)} (+1 por 4 PH). <button class="sm" id="rst">Aplicar valores iniciais</button></p></div>
<div class="card"><h2>Recursos</h2>${cnt('🎲 Dados do Assassino', 'kd', k.dice)}${cnt('💀 Pontos de Horror', 'kp', k.ph)}${cnt('😱 Sustos restantes', 'ks', k.su)}</div>
<div class="card"><h2>Ameaça ${E(k.th)}</h2><p><b>Passiva:</b> ${E(T[0])}</p><p><b>Ações únicas disponíveis:</b> ${E(T[1])}</p><p><b>Intento único:</b> ${E(T[2])}</p>${T2 ? `<hr style="border-color:var(--ln)"><h2>Ameaça ${E(k.th2)}</h2><p><b>Ações únicas:</b> ${E(T2[1])}</p><p><b>Intento único:</b> ${E(T2[2])}</p>` : ''}</div>
<div class="card"><h2>Ações gerais</h2><div class="row">${[['Assustar', 'ks', -1, 'susto'], ['Matar (só quem tem menos dados)', 'kd', -2, 'dados'], ['Escapar', 'kd', 1, 'dados'], ['Dificultar (+1 Etapa de Fuga)', 'kp', -4, 'PH'], ['Mutilar (6 no Ferir)', 'kp', 4, 'PH'], ['Susto opcional (Intérprete se contorceu)', 'kp', 1, 'PH']].map(a => `<button data-k="${a[1]}" data-d="${a[2]}">${a[0]} ${a[2] > 0 ? '+' : ''}${a[2]} ${a[3]}</button>`).join('')}</div><p class="dim">Ferir: role 1 dado — 6 mata; senão vira dado marcador de ferida (soma) e +1 Sequela.</p></div>
<div class="card"><h2>Ações únicas (★ = as suas, escolha 1 de cada Ameaça)</h2>${UA.map(a => `<div class="mk"><button class="sm" data-u="${a[0]}">${k.ua.includes(a[0]) ? '★' : '☆'}</button><span><b>${a[0]}</b> <span class="dim">${a[2]}</span></span><button class="sm" data-k="kp" data-d="${a[1] ? -a[1] : 1}" ${a[1] && k.ph < a[1] ? 'disabled' : ''}>${a[1] ? '−' + a[1] + ' PH' : '+1 PH'}</button></div>`).join('')}</div>
<div class="card"><h2>Intentos Horríveis (+PH)</h2>${INT.map(x => `<div class="mk"><span>${x[0]}</span><button class="sm" data-k="kp" data-d="${x[1]}">+${x[1]} PH</button></div>`).join('')}</div>
<div class="card"><h2>Depois de revelado</h2><div class="mk"><span>Converter qualidade neutra em desfavorável (2 dados)</span><button class="sm" data-k="kd" data-d="-2" ${k.dice < 2 ? 'disabled' : ''}>−2 dados</button></div>
<p class="dim">No início do seu turno num Encontro, aponte um apego descoberto de uma Sobrevivente viva:</p><div class="row"><button class="sm" data-k="kp" data-d="1">Item icônico +1 PH</button><button class="sm" data-k="kp" data-d="3">Relação afetiva +3 PH</button><button class="sm" data-k="kp" data-d="6">Desejo obscuro +6 PH</button></div></div>
<div class="card"><h2>Poderes especiais (★ = o seu)</h2>${POD.map(p => `<div class="mk"><button class="sm" data-o="${p[0]}">${k.own.includes(p[0]) ? '★' : '☆'}</button><span>${E(p[0])}</span><button class="sm" data-k="kp" data-d="-${p[1]}" ${k.ph < p[1] ? 'disabled' : ''}>Usar −${p[1]} PH</button></div>`).join('')}</div>
<div class="card"><p class="dim">Dica do livro: deixe sempre uma final girl para trás. Com dois Vultos, podem compartilhar a mesma pilha e um pode fingir morrer para ajudar o outro.</p></div>`;
            const sv = () => { save(c.id); render() }; $('#back').onclick = () => open({ t: view.m ? 'm' : 'login' }); $('#unm').onclick = () => { s.km = false; sv() };
            const g = $('#gv'); if (g) g.onclick = () => { s.give = 0; sv() }; $('#rst').onclick = () => { k.dice = k.n1 + k.n2; k.ph = k.n1; k.su = Math.max(0, 7 - mx); sv() };
            document.querySelectorAll('[data-nb]').forEach(e => e.onchange = () => { k['n' + e.dataset.nb] = +e.value; sv() }); document.querySelectorAll('[data-th]').forEach(e => e.onchange = () => { k[e.dataset.th === '1' ? 'th' : 'th2'] = e.value; sv() });
            const M = { kd: 'dice', kp: 'ph', ks: 'su' };
            document.querySelectorAll('[data-k]').forEach(b => b.onclick = () => {
                const key = M[b.dataset.k], d = b.dataset.d !== undefined ? +b.dataset.d : null;
                if (b.dataset.a === 'inc') k[key]++; else if (b.dataset.a === 'dec') k[key] = Math.max(0, k[key] - 1); else k[key] = Math.max(0, k[key] + d); sv()
            });
            document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { const n = b.dataset.o, i = k.own.indexOf(n); i < 0 ? k.own.push(n) : k.own.splice(i, 1); sv() });
            document.querySelectorAll('[data-u]').forEach(b => b.onclick = () => { const n = b.dataset.u, i = k.ua.indexOf(n); i < 0 ? k.ua.push(n) : k.ua.splice(i, 1); sv() })
        }

        login(); init();
    </script>
